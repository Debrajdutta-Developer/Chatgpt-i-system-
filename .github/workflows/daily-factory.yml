name: Daily autonomous software factory

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # 08:30 Asia/Kolkata (IST is UTC+05:30)

permissions:
  contents: write

concurrency:
  group: autonomous-software-factory
  cancel-in-progress: false

jobs:
  factory-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate factory before cycle
        run: python -m unittest discover -s tests -v

      - name: Run one Gemini-powered factory cycle
        id: factory
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash
          GEMINI_FALLBACK_MODELS: gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-2.5-flash-lite,gemini-2.5-flash
          GEMINI_RETRY_ATTEMPTS: "2"
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY repository secret is required for autonomous AI discovery."
            exit 2
          fi

          BEFORE_REPORTS="$(mktemp)"
          find reports -maxdepth 1 -type f -name '*.json' -printf '%f\n' 2>/dev/null | sort > "$BEFORE_REPORTS"

          python -m factory

          CURRENT_REPORT="$(comm -13 "$BEFORE_REPORTS" <(find reports -maxdepth 1 -type f -name '*.json' -printf '%f\n' 2>/dev/null | sort) | tail -n 1)"
          rm -f "$BEFORE_REPORTS"

          if [ -z "$CURRENT_REPORT" ]; then
            echo "Factory completed without creating a new report."
            exit 2
          fi

          echo "report=reports/$CURRENT_REPORT" >> "$GITHUB_OUTPUT"
          echo "Current cycle report: reports/$CURRENT_REPORT"

      - name: Revalidate factory and released projects
        run: |
          python -m unittest discover -s tests -v
          for project in projects/*; do
            if [ -d "$project/tests" ]; then
              (cd "$project" && python -m unittest discover -s tests -v && python -m compileall -q .)
            fi
            if [ -f "$project/app.js" ]; then
              node --check "$project/app.js"
            fi
            if [ -f "$project/core.js" ]; then
              node --check "$project/core.js"
            fi
            if [ -f "$project/test-core.js" ]; then
              node --check "$project/test-core.js"
              (cd "$project" && node test-core.js)
            fi
          done

      - name: Commit and push validated changes
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No valid factory changes to publish."
            exit 0
          fi
          git add factory-history.json reports projects
          if git diff --cached --quiet; then
            echo "No intended factory changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "factory: publish validated daily project $(date -u +'%Y-%m-%d') [skip ci]"
          git push

      - name: Publish new project as standalone repository
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
          REPORT: ${{ steps.factory.outputs.report }}
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "FACTORY_GITHUB_TOKEN is not configured; standalone repository publishing is skipped."
            exit 0
          fi

          if [ -z "$REPORT" ] || [ ! -f "$REPORT" ]; then
            echo "Current factory report is unavailable; refusing to publish an unrelated project."
            exit 2
          fi

          STATUS="$(python -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); print(d.get("final_status", d.get("status", "")))' "$REPORT")"
          if [ "$STATUS" != "SUCCESS" ]; then
            echo "Current factory cycle was not SUCCESS; no standalone repository will be created."
            exit 0
          fi

          PROJECT_PATH="$(python -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); print(d.get("project", d.get("project_path", "")))' "$REPORT")"
          PROJECT_SLUG="$(basename "$PROJECT_PATH")"
          LOCAL_PROJECT="projects/$PROJECT_SLUG"

          if [ -z "$PROJECT_SLUG" ] || [ ! -d "$LOCAL_PROJECT" ]; then
            echo "Could not resolve the validated project directory from $REPORT"
            exit 2
          fi

          if gh repo view "$GH_OWNER/$PROJECT_SLUG" >/dev/null 2>&1; then
            echo "Repository $GH_OWNER/$PROJECT_SLUG already exists; refusing to overwrite it."
            exit 0
          fi

          DESCRIPTION="Autonomously generated, functionally tested, and validated by Chatgpt-i-system- software factory."
          gh repo create "$GH_OWNER/$PROJECT_SLUG" --public --description "$DESCRIPTION"

          (
            cd "$LOCAL_PROJECT"
            git init -b main
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Initial validated release"
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GH_OWNER}/${PROJECT_SLUG}.git"
            git push -u origin main
          )

          echo "Published standalone repository: https://github.com/$GH_OWNER/$PROJECT_SLUG"

      - name: Upload cycle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-reports-${{ github.run_id }}
          path: reports/*.json
          if-no-files-found: warn
