name: Daily autonomous software factory

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # 08:30 Asia/Kolkata (IST is UTC+05:30)

permissions:
  contents: write

concurrency:
  group: autonomous-software-factory
  cancel-in-progress: false

jobs:
  factory-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate factory before cycle
        run: python -m unittest discover -s tests -v

      - name: Run one Gemini-powered factory cycle
        id: factory
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash
          GEMINI_FALLBACK_MODELS: gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-2.5-flash-lite,gemini-2.5-flash
          GEMINI_RETRY_ATTEMPTS: "2"
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY repository secret is required for autonomous AI discovery."
            exit 2
          fi

          BEFORE_REPORTS="$(mktemp)"
          find reports -maxdepth 1 -type f -name '*.json' -printf '%f\n' 2>/dev/null | sort > "$BEFORE_REPORTS"

          python -m factory

          CURRENT_REPORT="$(comm -13 "$BEFORE_REPORTS" <(find reports -maxdepth 1 -type f -name '*.json' -printf '%f\n' 2>/dev/null | sort) | tail -n 1)"
          rm -f "$BEFORE_REPORTS"

          if [ -z "$CURRENT_REPORT" ]; then
            echo "Factory completed without creating a new report."
            exit 2
          fi

          echo "report=reports/$CURRENT_REPORT" >> "$GITHUB_OUTPUT"
          echo "Current cycle report: reports/$CURRENT_REPORT"

      - name: Revalidate factory and current release
        env:
          REPORT: ${{ steps.factory.outputs.report }}
        shell: bash
        run: |
          python -m unittest discover -s tests -v

          STATUS="$(python -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); print(d.get("final_status", ""))' "$REPORT")"
          if [ "$STATUS" != "SUCCESS" ]; then
            echo "Current cycle has no releasable project."
            exit 0
          fi

          PROJECT_PATH="$(python -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); print(d.get("project_path", ""))' "$REPORT")"
          if [ -z "$PROJECT_PATH" ] || [ ! -d "$PROJECT_PATH" ]; then
            echo "Validated project path is missing from the current report."
            exit 2
          fi

          if [ -f "$PROJECT_PATH/package.json" ]; then
            (
              cd "$PROJECT_PATH"
              npm ci --ignore-scripts --no-audit --no-fund
              npm test
              npm run build
            )
            rm -rf "$PROJECT_PATH/node_modules" "$PROJECT_PATH/dist"
          elif [ -f "$PROJECT_PATH/test-core.js" ]; then
            node --check "$PROJECT_PATH/core.js"
            node --check "$PROJECT_PATH/app.js"
            node --check "$PROJECT_PATH/test-core.js"
            (cd "$PROJECT_PATH" && node test-core.js)
          elif [ -d "$PROJECT_PATH/tests" ]; then
            (cd "$PROJECT_PATH" && python -m unittest discover -s tests -v && python -m compileall -q src tests)
          else
            echo "Unknown project validation profile."
            exit 2
          fi

      - name: Commit and push validated changes
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No valid factory changes to publish."
            exit 0
          fi
          git add factory-history.json reports projects
          if git diff --cached --quiet; then
            echo "No intended factory changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "factory: publish validated daily project $(date -u +'%Y-%m-%d') [skip ci]"
          git push

      - name: Publish new project as standalone repository
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
          REPORT: ${{ steps.factory.outputs.report }}
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "FACTORY_GITHUB_TOKEN is required for end-to-end standalone publishing."
            exit 2
          fi

          if [ -z "$REPORT" ] || [ ! -f "$REPORT" ]; then
            echo "Current factory report is unavailable; refusing to publish an unrelated project."
            exit 2
          fi

          STATUS="$(python -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); print(d.get("final_status", d.get("status", "")))' "$REPORT")"
          if [ "$STATUS" != "SUCCESS" ]; then
            echo "Current factory cycle was not SUCCESS; no standalone repository will be created."
            exit 0
          fi

          PROJECT_PATH="$(python -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); print(d.get("project_path", d.get("project", "")))' "$REPORT")"
          PROJECT_SLUG="$(basename "$PROJECT_PATH")"
          LOCAL_PROJECT="projects/$PROJECT_SLUG"

          if [ -z "$PROJECT_SLUG" ] || [ ! -d "$LOCAL_PROJECT" ]; then
            echo "Could not resolve the validated project directory from $REPORT"
            exit 2
          fi

          # Final release-boundary verification. Never create a repo for code that
          # cannot pass its functional tests and production build in this exact checkout.
          if [ -f "$LOCAL_PROJECT/package.json" ]; then
            (
              cd "$LOCAL_PROJECT"
              npm ci --ignore-scripts --no-audit --no-fund
              npm test
              npm run build
            )
            rm -rf "$LOCAL_PROJECT/node_modules" "$LOCAL_PROJECT/dist"
          elif [ -f "$LOCAL_PROJECT/test-core.js" ]; then
            (cd "$LOCAL_PROJECT" && node test-core.js)
          elif [ -d "$LOCAL_PROJECT/tests" ]; then
            (cd "$LOCAL_PROJECT" && python -m unittest discover -s tests -v)
          else
            echo "No functional-test profile found; refusing standalone publication."
            exit 2
          fi

          if gh repo view "$GH_OWNER/$PROJECT_SLUG" >/dev/null 2>&1; then
            echo "Repository $GH_OWNER/$PROJECT_SLUG already exists; refusing to overwrite it."
            exit 2
          fi

          DESCRIPTION="Production-style app autonomously generated, tested, built and quality-gated by Chatgpt-i-system-."
          gh repo create "$GH_OWNER/$PROJECT_SLUG" --public --description "$DESCRIPTION"
          gh auth setup-git

          (
            cd "$LOCAL_PROJECT"
            git init -b main
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Initial validated release"
            git remote add origin "https://github.com/${GH_OWNER}/${PROJECT_SLUG}.git"
            git push -u origin main
          )
          rm -rf "$LOCAL_PROJECT/.git"

          REPO_URL="https://github.com/$GH_OWNER/$PROJECT_SLUG"
          python - "$REPORT" "$REPO_URL" <<'PY'
          import json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))
          data["standalone_repository"] = sys.argv[2]
          data["standalone_status"] = "SUCCESS"
          data["end_to_end_status"] = "SUCCESS"
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          git add "$REPORT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "factory: record standalone publication $PROJECT_SLUG [skip ci]"
          git push

          echo "Published standalone repository: $REPO_URL"

      - name: Upload cycle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-reports-${{ github.run_id }}
          path: reports/*.json
          if-no-files-found: warn
