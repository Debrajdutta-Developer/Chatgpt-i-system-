[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "env-sentinel"
version = "1.0.0"
description = "Local-first consistency checker for environment-variable contracts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Software Factory"}]

[project.scripts]
env-sentinel = "env_sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["env_sentinel*"]

