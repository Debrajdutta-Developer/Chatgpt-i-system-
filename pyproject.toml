[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-software-factory"
version = "2.0.0"
description = "A tested, transactional local-first software factory"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
software-factory = "factory.orchestrator:main"

[tool.setuptools.packages.find]
include = ["factory*"]
